<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#07061a">
  <title>คุยกับศูนย์ควบคุม WW East</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07061a; --ink: #f3f1ff; --mute: #a9a8cc; --dim: #7d7ba6;
      --glass: rgba(17, 15, 48, .62); --glass2: rgba(26, 22, 66, .78); --line: rgba(160, 150, 255, .16);
      --gold: #ffcf5c; --red: #ff5468; --green: #3ee6a8; --amber: #ffb547; --blue: #6aa8ff; --cyan: #00f0ff;
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: "Prompt", system-ui, "Noto Sans Thai", sans-serif; font-weight: 300; color: var(--ink); background: var(--bg);
      background-image: radial-gradient(1200px 700px at 50% -10%, rgba(120, 90, 255, .22), transparent 60%), radial-gradient(900px 600px at 100% 100%, rgba(0, 240, 255, .08), transparent 60%);
      display: flex; flex-direction: column; min-height: 100dvh; overflow: hidden; }
    button, input, textarea { font-family: inherit; }
    #stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    .wrap { position: relative; z-index: 1; width: 100%; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; flex: 1; min-height: 0; padding: 12px 14px calc(10px + var(--safe-b)); gap: 10px; }
    header { display: flex; align-items: center; gap: 10px; }
    header h1 { margin: 0; font-size: 17px; font-weight: 600; flex: 1; min-width: 0; line-height: 1.3; }
    header h1 small { display: block; font-size: 12px; font-weight: 300; color: var(--mute); }
    .icon-btn { flex: none; width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass); color: var(--ink); display: grid; place-items: center; cursor: pointer; font-size: 17px; }
    .icon-btn[aria-pressed="false"] { opacity: .55; }
    .icon-btn:focus-visible, .mic:focus-visible, .chip:focus-visible, .send:focus-visible, .full:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .strip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; min-height: 34px; }
    .strip::-webkit-scrollbar { display: none; }
    .pl { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); font-size: 12.5px; white-space: nowrap; }
    .pl i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px currentColor; color: var(--green); }
    .pl.alert i { background: var(--red); color: var(--red); } .pl.watch i { background: var(--amber); color: var(--amber); } .pl.error i { background: var(--dim); color: var(--dim); }
    .pl b { font-weight: 500; } .pl span { color: var(--mute); }
    .pl.sk { width: 120px; background: linear-gradient(90deg, var(--glass), rgba(60,50,130,.5), var(--glass)); background-size: 200% 100%; animation: sk 1.4s linear infinite; }
    @keyframes sk { to { background-position: -200% 0; } }
    .next { font-size: 12.5px; color: #d9f6ff; min-height: 18px; }
    .next:empty { display: none; }
    .stage { display: grid; place-items: center; padding: 6px 0 2px; }
    .orb { position: relative; width: 150px; height: 150px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; color: #2b1600;
      background: radial-gradient(circle at 38% 32%, #fff8e0 0, #ffe08a 18%, #ffb547 46%, #ff7a2a 72%, #8a2c00 100%);
      box-shadow: 0 0 40px rgba(255, 181, 71, .55), 0 0 110px rgba(255, 140, 40, .32), inset -14px -18px 40px rgba(120, 30, 0, .45); transition: transform .2s; }
    .orb::before { content: ""; position: absolute; inset: -16px; border-radius: 50%; border: 1px dashed rgba(255, 207, 92, .35); animation: spin 26s linear infinite; }
    .orb::after { content: ""; position: absolute; inset: -34px; border-radius: 50%; border: 1px solid rgba(160, 150, 255, .14); }
    .orb:active { transform: scale(.97); }
    .orb .lbl { position: relative; display: grid; place-items: center; gap: 2px; font-weight: 600; font-size: 14px; line-height: 1.25; text-align: center; }
    .orb .lbl svg { width: 34px; height: 34px; }
    .orb .lbl small { font-weight: 400; font-size: 11.5px; opacity: .8; }
    body.listening .orb { animation: pulse 1.1s ease-in-out infinite; background: radial-gradient(circle at 38% 32%, #ffffff 0, #b9fbff 20%, #00e0ff 50%, #2a66ff 78%, #10106a 100%); color: #001a2a;
      box-shadow: 0 0 50px rgba(0, 240, 255, .7), 0 0 130px rgba(42, 102, 255, .45); }
    body.thinking .orb .lbl svg { animation: spin 1.2s linear infinite; }
    body.speaking .orb { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.06); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state { margin-top: 18px; font-size: 13px; color: var(--mute); text-align: center; min-height: 20px; }
    .state.err { color: #ff9aa6; }
    .log { flex: 1; min-height: 120px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px; scroll-behavior: smooth; }
    .msg { max-width: 88%; padding: 10px 13px; border-radius: 16px; font-size: 14.5px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
    .msg.me { align-self: flex-end; background: linear-gradient(135deg, rgba(120, 90, 255, .55), rgba(80, 60, 200, .55)); border-bottom-right-radius: 5px; }
    .msg.ai { align-self: flex-start; background: var(--glass2); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
    .msg.ai.err { border-color: rgba(255, 84, 104, .45); color: #ffd5da; }
    .msg.ai .who { display: block; font-size: 11.5px; color: var(--gold); font-weight: 500; margin-bottom: 2px; }
    .msg .say { margin-top: 6px; height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--ink); font-size: 12px; cursor: pointer; }
    .dots span { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%; background: var(--mute); animation: b 1s infinite; }
    .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes b { 50% { transform: translateY(-4px); opacity: .5; } }
    .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; height: 36px; padding: 0 13px; border-radius: 999px; border: 1px solid rgba(255, 207, 92, .35); background: rgba(255, 207, 92, .08); color: #fff3cf; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .bar { display: flex; gap: 8px; align-items: flex-end; padding: 8px; border-radius: 18px; background: var(--glass2); border: 1px solid var(--line); }
    .bar textarea { flex: 1; min-width: 0; resize: none; border: 0; outline: none; background: transparent; color: var(--ink); font-size: 16px; line-height: 1.5; padding: 9px 6px; max-height: 110px; }
    .bar textarea::placeholder { color: var(--dim); }
    .mic { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; color: #001a2a; background: linear-gradient(135deg, #b9fbff, #00d0ff); }
    body.listening .mic { background: linear-gradient(135deg, #ff9aa6, #ff5468); color: #fff; animation: pulse 1.1s infinite; }
    .send { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; color: #160f00; background: linear-gradient(135deg, #ffe08a, #ffb547); }
    .send:disabled { opacity: .5; cursor: progress; }
    .opts { display: flex; align-items: center; gap: 12px; justify-content: space-between; flex-wrap: wrap; font-size: 12.5px; color: var(--mute); }
    .opts label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; min-height: 32px; }
    .opts input { width: 18px; height: 18px; accent-color: var(--gold); }
    .full { color: #9ff6ff; text-decoration: none; font-weight: 500; display: inline-flex; align-items: center; min-height: 32px; }
    .full:hover { text-decoration: underline; }
    .banner { padding: 9px 12px; border-radius: 12px; font-size: 13px; line-height: 1.5; background: rgba(255, 84, 104, .12); border: 1px solid rgba(255, 84, 104, .4); color: #ffd5da; }
    .banner[hidden] { display: none; }
    .keybox { display: flex; gap: 6px; margin-top: 6px; }
    .keybox input { flex: 1; min-width: 0; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.35); color: var(--ink); padding: 0 10px; font-size: 15px; }
    .keybox button { height: 38px; padding: 0 14px; border-radius: 10px; border: 0; background: var(--gold); color: #160f00; font-weight: 600; cursor: pointer; }
    .toast { position: fixed; left: 50%; bottom: calc(18px + var(--safe-b)); transform: translateX(-50%) translateY(20px); opacity: 0; transition: .25s; z-index: 5; max-width: min(92vw, 560px);
      padding: 10px 14px; border-radius: 12px; background: #1b1846; border: 1px solid var(--line); font-size: 13.5px; line-height: 1.5; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%); }
    .toast.bad { border-color: rgba(255, 84, 104, .5); }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    @media (min-width: 861px) { .orb { width: 180px; height: 180px; } .wrap { padding-top: 22px; } header h1 { font-size: 20px; } }
    @media (max-height: 700px) { .orb { width: 112px; height: 112px; } .orb .lbl svg { width: 26px; height: 26px; } .state { margin-top: 12px; } }
    @media (max-width: 860px) { body.chatting .orb { width: 96px; height: 96px; } body.chatting .orb .lbl svg { width: 24px; height: 24px; } body.chatting .orb .lbl small { display: none; } body.chatting .orb::after { inset: -22px; } body.chatting .state { margin-top: 10px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="wrap">
    <header>
      <h1>ศูนย์ควบคุม WW East <small id="nowLbl">คุยด้วยเสียงภาษาไทย</small></h1>
      <button type="button" class="icon-btn" id="btnRefresh" aria-label="รีเฟรชสรุปข้อมูล" title="รีเฟรชสรุปข้อมูล">↻</button>
      <button type="button" class="icon-btn" id="btnSpeaker" aria-pressed="true" aria-label="เสียงตอบ" title="เปิด/ปิดเสียงตอบ">🔊</button>
    </header>
    <div class="banner" id="banner" hidden></div>
    <div class="strip" id="strip" aria-label="สรุปดาวทุกดวง"><span class="pl sk"></span><span class="pl sk"></span><span class="pl sk"></span></div>
    <div class="next" id="next"></div>
    <div class="stage">
      <button type="button" class="orb" id="orb" aria-label="กดแล้วพูดภาษาไทย">
        <span class="lbl"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" stroke="currentColor" stroke-width="2"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span id="orbTxt">กดแล้วพูด</span><small id="orbSub">ภาษาไทย</small></span>
      </button>
      <div class="state" id="state" role="status" aria-live="polite">แตะดวงอาทิตย์ แล้วถามได้เลย</div>
    </div>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="chips" id="chips">
      <button type="button" class="chip">นัดประชุมครั้งถัดไปคือเมื่อไหร่</button>
      <button type="button" class="chip">วันนี้มีงานเลยกำหนดอะไรบ้าง</button>
      <button type="button" class="chip">สรุป Check In วันนี้</button>
      <button type="button" class="chip">Block FTTx ค้างกี่งาน</button>
      <button type="button" class="chip">OFC เลยกำหนดกี่งาน</button>
    </div>
    <form class="bar" id="form" onsubmit="return false">
      <button type="button" class="mic" id="mic" aria-label="พูดเพื่อถาม" title="กดแล้วพูดภาษาไทย"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" stroke="currentColor" stroke-width="2"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <label class="sr" for="q">คำถาม</label>
      <textarea id="q" rows="1" maxlength="500" placeholder="พิมพ์หรือกดไมค์แล้วพูด…" enterkeyhint="send"></textarea>
      <button type="submit" class="send" id="send" aria-label="ส่งคำถาม"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5L4 12z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
    </form>
    <div class="opts">
      <label><input type="checkbox" id="autoSend" checked> พูดจบแล้วส่งเลย</label>
      <a class="full" id="fullLink" href="#" target="_blank" rel="noopener">เปิดแดชบอร์ดเต็ม / เพิ่ม-แก้ข้อมูล ↗</a>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    /* ===== ตั้งค่า: ลิงก์ /exec ของ Apps Script "WW East Space Dashboard" (แก้ที่นี่ที่เดียว) ===== */
    const EXEC_URL = "https:\/\/script.google.com/macros/s/AKfycbxpOsPh76bZzzch7860aSqDYHAX0YQx7HtNUlWEW3hn6RMcfLTWxgMMknbE00u9yNBIrg/exec";

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const store = { get: (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
    const chatHist = [];
    let speakOn = store.get("ww_voice_speak", "1") === "1", busy = false;
    $("fullLink").href = EXEC_URL;
    $("autoSend").checked = store.get("ww_voice_auto", "1") === "1";
    $("autoSend").addEventListener("change", () => store.set("ww_voice_auto", $("autoSend").checked ? "1" : "0"));

    function toast(t, bad) { const el = $("toast"); el.textContent = t; el.classList.toggle("bad", !!bad); el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 4200); }
    function setState(t, err) { $("state").textContent = t; $("state").classList.toggle("err", !!err); }
    function mode(m) { ["listening", "thinking", "speaking"].forEach((c) => document.body.classList.toggle(c, c === m)); $("orbTxt").textContent = m === "listening" ? "กำลังฟัง…" : m === "thinking" ? "กำลังคิด…" : m === "speaking" ? "กำลังพูด" : "กดแล้วพูด"; $("orbSub").textContent = m === "listening" ? "แตะเพื่อหยุด" : m === "speaking" ? "แตะเพื่อหยุดเสียง" : "ภาษาไทย"; }

    /* ---------- API (อ่านอย่างเดียว) ---------- */
    function apiKey() { return store.get("ww_voice_key", ""); }
    async function apiGet(params) {
      const u = new URL(EXEC_URL); Object.keys(params).forEach((k) => u.searchParams.set(k, params[k]));
      if (apiKey()) u.searchParams.set("k", apiKey());
      const r = await fetch(u.toString(), { method: "GET", redirect: "follow", cache: "no-store" });
      return handle(r);
    }
    async function apiPost(body) {
      if (apiKey()) body.k = apiKey();
      const r = await fetch(EXEC_URL, { method: "POST", redirect: "follow", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
      return handle(r);
    }
    async function handle(r) {
      if (!r.ok) throw new Error("เซิร์ฟเวอร์ตอบกลับผิดพลาด (HTTP " + r.status + ")");
      let j; try { j = await r.json(); } catch (e) { throw new Error("อ่านคำตอบไม่ได้ — ตรวจว่า Apps Script deploy เวอร์ชันใหม่แล้ว"); }
      if (j && j.auth) showKeyBox();
      return j;
    }
    function netErr(e) { return e && e.message && /HTTP|อ่านคำตอบ/.test(e.message) ? e.message : "ติดต่อเซิร์ฟเวอร์ไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่"; }
    function showKeyBox() {
      const b = $("banner"); b.hidden = false;
      b.innerHTML = `ต้องใส่รหัสเข้าใช้ก่อน (ถามเจ้าของแดชบอร์ด)<div class="keybox"><input id="keyIn" type="password" autocomplete="off" placeholder="รหัสเข้าใช้"><button type="button" id="keyOk">ตกลง</button></div>`;
      $("keyOk").addEventListener("click", () => { store.set("ww_voice_key", $("keyIn").value.trim()); b.hidden = true; loadSummary(); });
    }

    /* ---------- สรุปดาว ---------- */
    async function loadSummary() {
      const b = $("btnRefresh"); b.disabled = true;
      try {
        const j = await apiGet({ api: "summary" });
        if (!j || !j.ok) throw new Error((j && j.error) || "อ่านสรุปไม่ได้");
        $("strip").innerHTML = (j.planets || []).map((p) => `<span class="pl ${esc(p.status)}" title="${esc(p.title + " · " + p.label)}"><i></i><b>${esc(p.title)}</b><span>${esc(p.label)}</span></span>`).join("");
        const n = j.next_meeting;
        $("next").textContent = n ? "📅 นัดถัดไป: " + [n.title, n.date, n.time, n.place].filter(Boolean).join(" · ") + (n.countdown ? " (" + n.countdown + ")" : "") : "📅 ไม่มีนัดถัดไป";
        if (j.now) $("nowLbl").textContent = j.now;
      } catch (e) {
        $("strip").innerHTML = `<span class="pl error"><i></i><span>${esc(e.message && !/fetch/i.test(e.message) ? e.message : netErr(e))}</span></span>`;
      } finally { b.disabled = false; }
    }
    $("btnRefresh").addEventListener("click", loadSummary);

    /* ---------- แชท ---------- */
    const log = $("log"), input = $("q");
    function add(role, text, opt) {
      opt = opt || {};
      const el = document.createElement("div"); el.className = "msg " + role + (opt.err ? " err" : "");
      if (opt.typing) el.innerHTML = `<span class="who">ศูนย์ควบคุม</span><span class="dots"><span></span><span></span><span></span></span>`;
      else {
        el.innerHTML = (role === "ai" ? `<span class="who">ศูนย์ควบคุม</span>` : "") + esc(text);
        if (role === "ai" && !opt.err) { const s = document.createElement("button"); s.type = "button"; s.className = "say"; s.textContent = "🔊 ฟังอีกครั้ง"; s.addEventListener("click", () => speak(text, true)); el.appendChild(document.createElement("br")); el.appendChild(s); }
      }
      log.appendChild(el); log.scrollTop = log.scrollHeight; return el;
    }
    function autosize() { input.style.height = "auto"; input.style.height = Math.min(110, input.scrollHeight) + "px"; }
    input.addEventListener("input", autosize);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(input.value); } });
    $("form").addEventListener("submit", () => ask(input.value));
    $("chips").querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => ask(b.textContent)));

    async function ask(q) {
      q = String(q || "").trim(); if (!q || busy) return;
      if (q.length > 500) { toast("คำถามยาวเกิน 500 ตัวอักษร", true); return; }
      busy = true; $("send").disabled = true; stopSpeak(); document.body.classList.add("chatting");
      input.value = ""; autosize(); add("me", q);
      const typing = add("ai", "", { typing: true }); mode("thinking"); setState("กำลังคิดคำตอบ…");
      try {
        const h = chatHist.slice(-4).map((x) => ({ role: x.role, text: x.text.slice(0, 300) }));
        const j = await apiGet({ api: "ask", q, h: JSON.stringify(h) });
        typing.remove();
        if (!j || !j.ok) { add("ai", "⚠️ " + ((j && j.error) || "ตอบไม่ได้"), { err: true }); mode(""); setState(j && j.rate ? "รอสักครู่แล้วลองใหม่" : "แตะดวงอาทิตย์ แล้วถามได้เลย", true); return; }
        chatHist.push({ role: "user", text: q }, { role: "model", text: j.answer });
        add("ai", j.answer); mode(""); setState("แตะดวงอาทิตย์เพื่อถามต่อ");
        speak(j.answer);
      } catch (e) {
        typing.remove(); add("ai", "⚠️ " + netErr(e), { err: true }); mode(""); setState("ติดต่อเซิร์ฟเวอร์ไม่ได้", true);
      } finally { busy = false; $("send").disabled = false; }
    }

    /* ---------- เสียงพูด: เสียงไทยในเครื่องก่อน ไม่มีแล้วใช้ api=tts ---------- */
    const synth = window.speechSynthesis;
    let thVoice = null, audio = null, seq = 0;
    const ttsMem = new Map();
    const NO_TH = "เครื่องนี้ไม่มีเสียงภาษาไทย ติดตั้ง Thai speech ใน Windows Settings > Time & language > Speech";
    const PREF = [/google.*(ไทย|thai)/i, /premwadee/i, /pattara/i, /niwat/i, /narisa|kanya|achara/i];
    function pickVoice() {
      if (!synth) return;
      const th = (synth.getVoices() || []).filter((v) => /^th(-|_|$)/i.test(v.lang || "") || /ไทย|thai/i.test(v.name || ""));
      thVoice = null; for (const re of PREF) { const v = th.find((x) => re.test(x.name || "")); if (v) { thVoice = v; break; } }
      if (!thVoice) thVoice = th[0] || null;
    }
    if (synth) { pickVoice(); if (synth.addEventListener) synth.addEventListener("voiceschanged", pickVoice); else synth.onvoiceschanged = pickVoice; [300, 1000, 2500].forEach((ms) => setTimeout(pickVoice, ms)); }
    function speechText(t) {
      return String(t == null ? "" : t)
        .replace(/\x60{3}[\s\S]*?\x60{3}/g, " ").replace(/\[([^\]]*)\]\([^)]*\)/g, "$1").replace(/https?:\S+/g, " ")
        .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{20E3}\u{E0020}-\u{E007F}]/gu, "")
        .replace(/^\s*[-*•]\s+/gm, "").replace(/^\s*#+\s*/gm, "").replace(/[*_#>\x60~|]/g, "").replace(/\s+/g, " ").trim();
    }
    function stopSpeak() { seq++; if (synth) synth.cancel(); if (audio) { try { audio.pause(); } catch (e) {} audio = null; } if (document.body.classList.contains("speaking")) mode(""); }
    function warnNoThai() { if (sessionStorage.getItem("ww_tts_warn") === "1") return; sessionStorage.setItem("ww_tts_warn", "1"); toast("🔈 " + NO_TH, true); }
    async function speak(text, force) {
      if (!speakOn && !force) return;
      stopSpeak();
      const clean = speechText(text); if (!clean) return;
      const my = seq;
      if (synth && !thVoice) pickVoice();
      if (synth && thVoice) {
        const u = new SpeechSynthesisUtterance(clean); u.voice = thVoice; u.lang = thVoice.lang || "th-TH"; u.rate = 1.02;
        u.onstart = () => mode("speaking"); u.onend = u.onerror = () => { if (my === seq) mode(""); };
        synth.speak(u); return;
      }
      try {
        mode("speaking");
        let src = ttsMem.get(clean);
        if (!src) {
          const j = await apiPost({ api: "tts", text: clean.slice(0, 1500) });
          if (!j || !j.ok || !j.b64) throw new Error((j && j.error) || "ไม่มีเสียง");
          src = "data:" + (j.mime || "audio/wav") + ";base64," + j.b64; ttsMem.set(clean, src); if (ttsMem.size > 12) ttsMem.delete(ttsMem.keys().next().value);
        }
        if (my !== seq) return;
        const a = new Audio(src); audio = a;
        a.onended = a.onerror = () => { if (audio === a) { audio = null; mode(""); } };
        await a.play();
      } catch (e) { if (my === seq) mode(""); warnNoThai(); }
    }
    function paintSpeaker() { $("btnSpeaker").setAttribute("aria-pressed", speakOn ? "true" : "false"); $("btnSpeaker").textContent = speakOn ? "🔊" : "🔇"; }
    $("btnSpeaker").addEventListener("click", () => { speakOn = !speakOn; store.set("ww_voice_speak", speakOn ? "1" : "0"); if (!speakOn) stopSpeak(); paintSpeaker(); });
    paintSpeaker();

    /* ---------- ไมค์ (Web Speech th-TH) ---------- */
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const secure = window.isSecureContext || location.hostname === "localhost" || location.hostname === "127.0.0.1";
    let rec = null, listening = false, finalText = "", micErr = "";
    function banner(t) { const b = $("banner"); b.textContent = t; b.hidden = !t; }
    if (!secure) { micErr = "ต้องเปิดหน้านี้ผ่าน https ไมค์จึงจะทำงาน (ตอนนี้เปิดแบบ " + location.protocol.replace(":", "") + ")"; banner("⚠️ " + micErr + " — ยังพิมพ์ถามได้ตามปกติ"); }
    else if (!SR) { micErr = "เบราว์เซอร์นี้ไม่รองรับการพูด ใช้ Chrome หรือ Edge หรือกดไมค์บนคีย์บอร์ดมือถือ / Win+H แล้วพูดลงช่องพิมพ์"; }
    if (SR && secure) {
      rec = new SR(); rec.lang = "th-TH"; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
      rec.onstart = () => { listening = true; mode("listening"); setState("กำลังฟัง… พูดได้เลย"); };
      rec.onresult = (e) => { let interim = ""; finalText = ""; for (let i = 0; i < e.results.length; i++) { if (e.results[i].isFinal) finalText += e.results[i][0].transcript; else interim += e.results[i][0].transcript; } input.value = finalText || interim; autosize(); };
      rec.onerror = (e) => {
        listening = false; mode("");
        const m = e.error === "not-allowed" || e.error === "service-not-allowed" ? "ไม่ได้รับอนุญาตให้ใช้ไมค์ — กดรูปกุญแจ/ไอคอนข้างช่องที่อยู่เว็บ › อนุญาตไมโครโฟน แล้วลองใหม่"
          : e.error === "audio-capture" ? "ไม่พบไมโครโฟน ตรวจว่าเสียบไมค์หรือเปิดสิทธิ์ไมค์ในเครื่องแล้ว"
          : e.error === "network" ? "ระบบฟังเสียงต้องใช้อินเทอร์เน็ต ตรวจการเชื่อมต่อแล้วลองใหม่"
          : e.error === "no-speech" ? "ไม่ได้ยินเสียง ลองพูดใหม่อีกครั้ง" : e.error === "aborted" ? "" : "ฟังเสียงไม่สำเร็จ (" + e.error + ")";
        if (m) { setState(m, true); if (e.error !== "no-speech") toast("🎙️ " + m, true); }
      };
      rec.onend = () => {
        const was = listening; listening = false; if (document.body.classList.contains("listening")) mode("");
        const q = (finalText || "").trim(); finalText = "";
        if (!q) { if (was && !$("state").classList.contains("err")) setState("แตะดวงอาทิตย์ แล้วถามได้เลย"); return; }
        if ($("autoSend").checked) ask(q); else { input.value = q; autosize(); input.focus(); setState("แก้คำถามได้ แล้วกดส่ง"); }
      };
    }
    function toggleMic() {
      if (!rec) { setState(micErr, true); toast("🎙️ " + micErr, true); input.focus(); return; }
      if (listening) { rec.stop(); return; }
      stopSpeak(); finalText = ""; input.value = ""; autosize();
      try { rec.start(); } catch (e) { setState("เริ่มฟังไม่ได้ ลองกดอีกครั้ง", true); }
    }
    $("mic").addEventListener("click", toggleMic);
    $("orb").addEventListener("click", () => { if (document.body.classList.contains("speaking")) { stopSpeak(); return; } toggleMic(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (listening && rec) rec.abort(); stopSpeak(); } });

    /* ---------- ดาวพื้นหลัง (เบาๆ) ---------- */
    (function stars() {
      const cv = $("stars"), ctx = cv.getContext("2d"); let list = [], raf = 0;
      const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
      function resize() { const d = Math.min(2, window.devicePixelRatio || 1); cv.width = innerWidth * d; cv.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0);
        list = Array.from({ length: Math.round(innerWidth * innerHeight / 9000) }, () => ({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: Math.random() * 1.2 + .2, p: Math.random() * 6.28 })); draw(0); }
      function draw(t) { ctx.clearRect(0, 0, innerWidth, innerHeight); for (const s of list) { ctx.globalAlpha = .35 + .45 * Math.abs(Math.sin(s.p + t / 1600)); ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill(); } }
      function loop(t) { draw(t); raf = requestAnimationFrame(loop); }
      addEventListener("resize", resize); resize();
      if (!reduce) raf = requestAnimationFrame(loop);
      document.addEventListener("visibilitychange", () => { cancelAnimationFrame(raf); if (!document.hidden && !reduce) raf = requestAnimationFrame(loop); });
    })();

    loadSummary();
    add("ai", "สวัสดีครับ ถามเรื่องงาน WW East ได้เลย เช่น นัดประชุมครั้งถัดไป งานเลยกำหนด หรือเบอร์ผู้คุมงาน แตะดวงอาทิตย์แล้วพูด หรือพิมพ์ด้านล่างก็ได้ครับ");
  </script>
</body>
</html>
