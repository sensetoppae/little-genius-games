        fields: [{ k: "date", type: "date", label: "วันที่ประชุม", def: "today", req: true }, { k: "title", label: "หัวข้อ", req: true, max: 300, ph: "เช่น ประชุมการไฟฟ้าบางแสน" },
          { k: "detail", type: "textarea", label: "รายละเอียดจากการประชุม", ph: "- คุยแผนจัดระเบียบสาย\n- นัดครั้งถัดไป 5 ม.ค." }, { k: "who", label: "ผู้บันทึก", max: 120, ph: "ชื่อหรืออีเมล (ไม่ใส่ก็ได้)", def: "who" }] },
      meetings: { btn: "➕ เพิ่มนัดหมาย", fn: "addAppointment", url: "/api/appointments/add", ok: "✅ บันทึกนัดหมายแล้ว", titleKey: "title",
        hint: "บันทึกลงชีตแท็บ “Form Responses 3” 1 แถว รูปแบบเดียวกับบอทเลขา (เฉพาะเจ้าของสคริปต์)",
        fields: [{ k: "date", type: "date", label: "วันที่", def: "today", req: true, half: true }, { k: "time", type: "time", label: "เวลา", half: true },
          { k: "title", label: "หัวข้อ", req: true, max: 300, ph: "เช่น ประชุมการไฟฟ้าบางแสน" }, { k: "place", label: "สถานที่", max: 300, ph: "เช่น กฟภ.บางแสน" },
          { k: "province", label: "จังหวัด", max: 60, ph: "เช่น ชลบุรี (ไม่ใส่ก็ได้)" }] },
      fttx: { btn: "➕ เพิ่มงาน Block FTTx", fn: "addFttxJob", url: "/api/fttx/add", ok: "✅ เพิ่มงาน Block FTTx แล้ว", titleKey: "name", meta: "fttxFormMeta", metaUrl: "/api/fttx/meta",
        hint: "เขียนแถวใหม่ต่อจากงานล่าสุดในแท็บ “Block FTTx” เฉพาะคอลัมน์ A–F (เฉพาะเจ้าของสคริปต์)",
        fields: [{ k: "name", label: "Name (มีรหัส UGRL)", req: true, max: 300, ph: "เช่น UGRL08405 ชื่องาน" }, { k: "req", label: "Request No", max: 60, half: true },
          { k: "target", type: "date", label: "Target Date", half: true }, { k: "status", type: "select", label: "สถานะ", half: true },
          { k: "data", type: "date", label: "Data", def: "today", half: true }, { k: "closeNo", label: "Request No ปิดงาน", max: 60 }] }
    };
    function makeAddForms(o) {
      const st = { open: null, vals: {}, err: "", saving: false, saved: null, meta: {}, who: null };
      const ymdOf = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      const today = () => ymdOf(new Date());
      const ph = (s) => esc(s || "").replace(/\n/g, "&#10;");
      function callServer(fn, url, payload) {
        if (IS_REMOTE) return gas(fn, payload);
        return fetch(url, payload == null ? { cache: "no-store" } : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
          .then((r) => r.json().catch(() => ({ ok: false, error: "HTTP " + r.status })));
      }
      function fieldHtml(id, f) {
        const v = st.vals[f.k] == null ? "" : st.vals[f.k], req = f.req ? " <b>*</b>" : "", cls = f.half ? ' class="half"' : "";
        let type = f.type || "text";
        if (id === "fttx" && f.k === "data" && st.meta.fttx && st.meta.fttx.a_is_date === false) type = "text";
        let ctl;
        if (type === "textarea") ctl = `<textarea name="${f.k}" rows="6" placeholder="${ph(f.ph)}">${esc(v)}</textarea>`;
        else if (type === "select") {
          const m = st.meta[id], opts = (m && m.statuses) || [];
          const list = opts.map((x) => x.value);
          if (v && list.indexOf(v) < 0) list.unshift(v);
          ctl = `<select name="${f.k}"><option value="">${m ? "— ว่าง —" : "กำลังโหลดสถานะ…"}</option>` +
            list.map((x) => { const c = opts.find((y) => y.value === x); return `<option value="${esc(x)}"${x === v ? " selected" : ""}>${esc(x)}${c ? " (" + c.count + ")" : ""}</option>`; }).join("") + `</select>`;
        } else ctl = `<input type="${type}" name="${f.k}" value="${esc(v)}"${f.max ? ` maxlength="${f.max}"` : ""}${f.ph ? ` placeholder="${ph(f.ph)}"` : ""}${f.req ? " required" : ""}>`;
        return `<label${cls}><span>${esc(f.label)}${req}</span>${ctl}</label>`;
      }
      function html(id) {
        const cfg = ADD_FORMS[id]; if (!cfg) return "";
        const ok = st.saved && st.saved.id === id ? st.saved : null;
        let h = ok ? `<div class="af-ok" role="status"><span>${esc(cfg.ok)} · ${esc(ok.title)}${ok.row ? " (แถว " + esc(ok.row) + ")" : ""}</span>${ok.url ? `<a href="${esc(ok.url)}" target="_blank" rel="noopener">เปิดในชีต ↗</a>` : ""}</div>` : "";
        if (st.open !== id) return h + `<button type="button" class="af-add" data-af-open="${id}">${esc(cfg.btn)}</button>`;
        return h + `<form class="af" data-af-form="${id}" novalidate><h4>${esc(cfg.btn)}</h4>` + cfg.fields.map((f) => fieldHtml(id, f)).join("") +
          `<div class="af-err" role="alert">${esc(st.err)}</div><div class="af-hint">${esc(cfg.hint)}</div>` +
          `<div class="af-act"><button type="button" class="cancel" data-af-cancel>ยกเลิก</button><button type="submit" class="save"${st.saving ? " disabled" : ""}>${st.saving ? "กำลังบันทึก…" : "บันทึก"}</button></div></form>`;
      }
      function readForm(form) { if (!form) return; Array.prototype.forEach.call(form.elements, (el) => { if (el.name) st.vals[el.name] = el.value; }); }
      function open(id) {
        const cfg = ADD_FORMS[id]; st.open = id; st.err = ""; st.saving = false; st.saved = null; st.vals = {};
        cfg.fields.forEach((f) => { st.vals[f.k] = f.def === "today" ? today() : f.def === "who" ? (st.who || "") : ""; });
        if (id === "fttx" && st.meta.fttx) st.vals.status = st.meta.fttx.default_status || "";
        o.rerender(id);
        const first = document.querySelector('[data-af-form="' + id + '"] [required]:not([type="date"])') || document.querySelector('[data-af-form="' + id + '"] input');
        if (first) { try { first.focus({ preventScroll: true }); } catch (e) {} if (first.scrollIntoView) first.closest("form").scrollIntoView({ block: "nearest" }); }
        if (id === "notes" && st.who == null && IS_REMOTE) callServer("noteFormDefaults", "", {}).then((j) => {
          st.who = (j && j.who) || "";
          if (st.open === "notes" && !st.vals.who && st.who) { st.vals.who = st.who; const w = document.querySelector('[data-af-form="notes"] [name="who"]'); if (w && !w.value) w.value = st.who; }
        }).catch(() => { st.who = ""; });
        if (cfg.meta && !st.meta[id]) {
          const p = IS_EMBED ? Promise.resolve(o.embedMeta(id)) : callServer(cfg.meta, cfg.metaUrl, null);
          p.then((m) => { st.meta[id] = m && m.statuses ? m : { statuses: [], default_status: "" };
            if (st.open === id) { const form = document.querySelector('[data-af-form="' + id + '"]'); readForm(form); if (!st.vals.status) st.vals.status = st.meta[id].default_status || ""; o.rerender(id); } })
            .catch(() => { st.meta[id] = { statuses: [], default_status: "" }; if (st.open === id) o.rerender(id); });
        }
      }
      async function save(id, form) {
        const cfg = ADD_FORMS[id]; if (st.saving) return;
        readForm(form);
        for (const f of cfg.fields) {
          const v = String(st.vals[f.k] || "").trim();
          if (f.req && !v) { st.err = "กรุณาใส่" + f.label.replace(/\s*\(.*\)$/, ""); form.querySelector(".af-err").textContent = st.err; const el = form.elements[f.k]; if (el) el.focus(); return; }
          if (f.type === "date" && v && !/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(v) && !(id === "fttx" && f.k === "data")) { st.err = f.label + " ไม่ถูกต้อง"; form.querySelector(".af-err").textContent = st.err; return; }
        }
        const payload = {}; cfg.fields.forEach((f) => { payload[f.k] = String(st.vals[f.k] || "").trim(); });
        if (id === "notes") payload.detail = String(st.vals.detail || "");
        st.err = ""; st.saving = true; o.rerender(id);
        try {
          const j = IS_EMBED ? await new Promise((r) => setTimeout(() => r(o.embedSave(id, payload)), 700)) : await callServer(cfg.fn, cfg.url, payload);
          if (!j || j.ok === false) throw new Error((j && j.error) || "ผิดพลาด");
          st.open = null; st.saving = false; st.saved = { id: id, title: payload[cfg.titleKey], row: j.row, url: j.url || "" };
          await o.onSaved(id, j, cfg);
        } catch (e) {
          st.saving = false; st.err = "บันทึกไม่สำเร็จ: " + (e && e.message ? e.message : e);
          o.rerender(id); o.toast("⚠️ " + st.err, true);
        }
      }
      function bind(root, id) {
        const ob = root.querySelector('[data-af-open="' + id + '"]'); if (ob) ob.addEventListener("click", () => open(id));
        const form = root.querySelector('[data-af-form="' + id + '"]'); if (!form) return;
        form.addEventListener("input", () => readForm(form)); form.addEventListener("change", () => readForm(form));
        form.querySelector("[data-af-cancel]").addEventListener("click", () => { st.open = null; st.err = ""; o.rerender(id); });
        form.addEventListener("submit", (e) => { e.preventDefault(); save(id, form); });
      }
      return { html, bind, open, st, has: (id) => !!ADD_FORMS[id], today };
    }
    // หน้าตัวอย่าง (ไม่มีเซิร์ฟเวอร์): จำลองการบันทึกในหน้าเว็บเท่านั้น
    function embedAddSave(id, v, d) {
      d = d || {}; const pl = JSON.parse(JSON.stringify(d)); const row = 100 + Math.floor(Math.random() * 50);
      const ymdDisp = (y) => y ? y.slice(8, 10) + "/" + y.slice(5, 7) + "/" + y.slice(0, 4) : "";
      if (id === "notes") { pl.notes = [{ row_num: row, date: ymdDisp(v.date), ymd: v.date, title: v.title, detail: v.detail, who: v.who, chat: "Dashboard" }].concat(pl.notes || []); pl.count = pl.notes.length; pl.missing = false; pl.message = ""; if (pl.metrics && pl.metrics[0]) pl.metrics[0].value = String(pl.count); }
      if (id === "meetings") { pl.upcoming = (pl.upcoming || []).concat([{ row_num: row, date: ymdDisp(v.date), ymd: v.date, time: v.time ? v.time.replace(/^0/, "") + " น." : "", title: v.title, place: [v.place, v.province].filter(Boolean).join(" "), days: 0, countdown: "ใหม่", tone: "ok" }]).sort((a, b) => (a.ymd < b.ymd ? -1 : a.ymd > b.ymd ? 1 : 0)); pl.count = pl.upcoming.length; pl.count_label = "นัดถัดไป " + pl.count; }
      if (id === "fttx") { pl.open_total = (pl.open_total || 0) + 1; (pl.metrics || []).forEach((m) => { if (m.label === "เปิดอยู่") m.value = String(pl.open_total); }); }
      const hm = new Date(); pl.updated_hm = String(hm.getHours()).padStart(2, "0") + ":" + String(hm.getMinutes()).padStart(2, "0");
      return { ok: true, row: row, url: (d.sheet_url || "").split("#")[0] + "#gid=0&range=A" + row, planet: pl };
    }
    function embedAddMeta(id) {
      return id === "fttx" ? { statuses: [{ value: "รอดำเนินการ", count: 12 }, { value: "รอปิดงาน", count: 5 }, { value: "ปิดงาน", count: 40 }], default_status: "รอดำเนินการ", a_is_date: true } : {};
    }
    function drawAdd() {
      const box = $("addBox"), d = DATA && DATA.planets && DATA.planets[JOB];
      if (!AF.has(JOB) || !d || d.ok === false) { box.hidden = true; box.innerHTML = ""; return; }
      box.hidden = false; box.innerHTML = AF.html(JOB); AF.bind(box, JOB);
    }
    const AF = makeAddForms({
      rerender() { drawAdd(); },
      toast(t, bad) { toast(t, bad); },
      embedSave(id, v) { return embedAddSave(id, v, DATA.planets[id]); },
      embedMeta(id) { return embedAddMeta(id); },
      async onSaved(id, j, cfg) {
        drawAdd(); $("orb").classList.add("refreshing");
        await new Promise((r) => setTimeout(r, 900));
        if (j.planet) DATA.planets[id] = j.planet;
        render(DATA); $("orb").classList.remove("refreshing");
        toast(cfg.ok + (IS_EMBED ? " (ตัวอย่าง — ไม่ได้บันทึกจริง)" : ""), false, j.url ? { href: j.url, label: "เปิดในชีต ↗" } : null);
      }
    });

    /* ---------- Render ---------- */
    function render(data) {
      DATA = data || { planets: {} };
      const d = (DATA.planets || {})[JOB];
      const custom = (DATA.custom || []).find((c) => c.id === JOB);
      const meta = META[JOB] || [custom ? custom.title : JOB, custom ? custom.color : "#7ad7ff"];
      document.documentElement.style.setProperty("--c", meta[1]);
      document.title = meta[0] + " · Dashboard · จักรวาล WW RAUG East";
      $("ttl").textContent = meta[0] + " · Dashboard";
      $("badge").hidden = !(DATA.example || (d && d.example));
      const sheet = $("sheet");
      if (d && d.sheet_url) { sheet.href = d.sheet_url; sheet.hidden = false; sheet.style.display = ""; } else sheet.style.display = "none";
      $("refresh").style.display = "";
      const mapBtn = $("openMap"); if (mapBtn) mapBtn.hidden = JOB !== "checkin";
      if (!d) { $("sub").textContent = "ไม่พบข้อมูลของดาวนี้"; $("kpis").innerHTML = ""; charts(""); $("tbl").innerHTML = `<div class="err">ยังไม่มีข้อมูลของ “${esc(JOB)}” — กลับหน้าอวกาศแล้วกดรีเฟรช</div>`; return; }
      $("sub").textContent = [d.count_label, d.updated_hm ? "อัปเดตล่าสุด " + d.updated_hm : (DATA.updated_label || "").replace("\n", " ")].filter(Boolean).join(" · ");
      if (d.ok === false) { $("kpis").innerHTML = ""; charts(""); $("tbl").innerHTML = `<div class="err">อ่านชีตไม่ได้: ${esc(d.error || "")}</div>`; return; }
      (custom ? PAGES.custom : PAGES[JOB] || PAGES.custom)(d);
      drawAdd();
    }
    function toast(t, bad, link) {
      const el = $("toast"); el.textContent = t;
      if (link && link.href) { const a = document.createElement("a"); a.href = link.href; a.target = "_blank"; a.rel = "noopener"; a.textContent = link.label || "เปิด"; el.appendChild(a); }
      el.classList.toggle("bad", !!bad); el.classList.toggle("link", !!(link && link.href)); el.classList.add("show");
      clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show", "link"), link ? 7000 : 3600);
    }
    $("refresh").addEventListener("click", async () => {
      const b = $("refresh"); b.classList.add("spin"); b.disabled = true; $("orb").classList.add("refreshing");
      const hm = () => { const d = new Date(); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
      try { const j = await API.refresh(); if (!j || j.ok === false) throw new Error((j && j.error) || "ผิดพลาด"); DATA.planets[JOB] = j.planet; render(DATA); toast(`✅ รีเฟรช ${$("ttl").textContent.replace(" · Dashboard", "")} เสร็จแล้ว · ${j.planet.updated_hm || hm()}`); }
      catch (e) { toast("⚠️ รีเฟรชไม่สำเร็จ: " + (e && e.message ? e.message : e), true); }
      finally { b.classList.remove("spin"); b.disabled = false; $("orb").classList.remove("refreshing"); }
    });
    API.data().then(render).catch((e) => { $("tbl").innerHTML = `<div class="err">โหลดข้อมูลไม่สำเร็จ: ${esc(e && e.message || e)}</div>`; });
    if (!IS_EMBED) setInterval(() => { if (!document.hidden) API.data().then(render).catch(() => {}); }, 4 * 60 * 60 * 1000);
  })();
  </script>
</body>
